<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Paper tearing performance</title>
    <style>
      body { margin: 20px; background: #edf1f5; font: 14px/1.5 system-ui; }
      button { font: inherit; padding: 10px; }
      pre { white-space: pre-wrap; }

    <script type="module" src="./paper-tearing.js"></script>
